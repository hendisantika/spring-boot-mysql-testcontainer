# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      TC_CLOUD_TOKEN: ${{ secrets.TC_CLOUD_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # By default Testcontainers uses the Docker daemon provided by the GitHub runner.
    # Testcontainers Cloud is opt-in: set the repository variable
    # USE_TESTCONTAINERS_CLOUD=true and provide the TC_CLOUD_TOKEN secret.
    # (Fork / Dependabot PRs never receive the secret, so they always use the runner's Docker.)
    - name: Setup Testcontainers Cloud Client
      if: ${{ vars.USE_TESTCONTAINERS_CLOUD == 'true' && env.TC_CLOUD_TOKEN != '' }}
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        token: ${{ env.TC_CLOUD_TOKEN }}
        # Wait until the cloud Docker engine is ready before running the tests
        wait: true

    - name: Build & run unit + integration tests
      run: mvn -B verify --file pom.xml

  dependency-graph:
    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
    # Needs write access, so it only runs on pushes to main (not on pull requests).
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
